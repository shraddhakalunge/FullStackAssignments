<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6fb;
}

header{
    background:#a8c5e8;
    color:#263858;
    padding:25px;
    text-align:center;
}

nav{
    background:#394867;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:17px;
}

nav a:hover{
    color:#cde8f6;
}

.container{
    display:flex;
    justify-content:center;
    margin-top:45px;
    gap:30px;
}

.card{
    background:#ffffff;
    padding:25px;
    width:220px;
    border-radius:12px;
    box-shadow:0px 3px 12px #d5dce8;
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    background:#eef5ff;
}

button{
    background:#7986cb;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#5c6bc0;
}

footer{
    background:#394867;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:55px;
}
</style>

</head>

<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>A simple place to explore and learn</p>
</header>

<nav>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
</nav>

<div class="container">

    <div class="card">
        <h3>About Us</h3>
        <p>Learn more about our website and what we do.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h3>Our Services</h3>
        <p>Explore simple and useful website features.</p>
        <button>Explore</button>
    </div>

</div>

<footer>
    <p>Created with HTML and Internal CSS</p>
</footer>

</body>
</html>
