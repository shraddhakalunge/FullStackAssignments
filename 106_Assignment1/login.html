
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body style="margin:0;font-family:Arial;background:linear-gradient(to right,#e0c3fc,#c2e9fb);display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="background:#ffffff;padding:30px;border-radius:15px;width:300px;text-align:center;box-shadow:0px 4px 15px #b8b8d1;">

    <h2 style="color:#394867;">Welcome Back</h2>
    <p style="color:#777;">Login to continue</p>

    <input type="text" placeholder="Enter Username"
    style="width:90%;box-sizing:border-box;padding:11px;margin:10px 0;border:1px solid #c5c8dc;border-radius:6px;"><br>

    <input type="password" placeholder="Enter Password"
    style="width:90%;box-sizing:border-box;padding:11px;margin:10px 0;border:1px solid #c5c8dc;border-radius:6px;"><br>

    <a href="home.html" style="text-decoration:none;">
        <button style="padding:11px 35px;margin-top:10px;background:#7986cb;color:white;border:none;border-radius:6px;cursor:pointer;">
            Login
        </button>
    </a>

    <p style="margin-top:22px;color:#555;">
        New here?
        <a href="signup.html" style="color:#5c6bc0;">Create an account</a>
    </p>

    <a href="index.html" style="color:#5c6bc0;text-decoration:none;font-size:14px;">Back to Home</a>

</div>

</body>
</html>
